name: Core boundaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check source types and regenerate declaration snapshots
        run: bun x --package typescript@5.9.3 tsc --declaration --emitDeclarationOnly --noEmit false --outDir types
      - name: Build browser ESM and verify reproducible snapshots
        run: |
          bun run build
          git diff --exit-code -- types dist src/client-version.json
      - name: Check grammar limits, diagnostic boundaries and real Node consumers
        run: bun test
      - name: Check actual package declarations in a NodeNext TypeScript consumer
        run: bun x --package typescript@5.9.3 tsc --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --noEmit test/fixtures/consumer-types.mts
      - name: Verify recorded source integrity and metadata exclusion
        run: |
          bun scripts/manifest.ts
          git diff --exit-code -- MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
